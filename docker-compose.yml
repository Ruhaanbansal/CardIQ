version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cardiq_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-cardiq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cardiq_password}
      POSTGRES_DB: ${DB_NAME:-cardiq}
    volumes:
      - cardiq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cardiq_user} -d ${DB_NAME:-cardiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cardiq_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cardiq_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: cardiq_chromadb
    ports:
      - "8000:8000"
    volumes:
      - cardiq_chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: cardiq_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cardiq.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  cardiq_pg_data:
  cardiq_redis_data:
  cardiq_chroma_data:
