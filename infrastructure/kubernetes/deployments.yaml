apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiq-backend
  namespace: cardiq-prod
  labels:
    app: cardiq-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cardiq-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cardiq-backend
    spec:
      containers:
      - name: backend
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cardiq-backend:latest
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: cardiq-backend-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiq-frontend
  namespace: cardiq-prod
  labels:
    app: cardiq-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardiq-frontend
  template:
    metadata:
      labels:
        app: cardiq-frontend
    spec:
      containers:
      - name: frontend
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cardiq-frontend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: cardiq-frontend-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
